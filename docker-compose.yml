services:
  classrack-11249-db:
    image: postgres:16
    environment:
      POSTGRES_USER: classrack
      POSTGRES_PASSWORD: classrack
      POSTGRES_DB: classrack
    ports:
      - "5432:5432"
    volumes:
      - classrack-11249-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  classrack-11249-web:
    build: .
    ports:
      - "3000:3000"
      - "5555:5555"
    environment:
      DATABASE_URL: postgresql://classrack:classrack@classrack-11249-db:5432/classrack
      AUTH_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      UPLOADTHING_TOKEN: ${UPLOADTHING_TOKEN}
      CRON_SECRET: ${CRON_SECRET}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      classrack-11249-db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npx prisma studio --port 5555 --hostname 0.0.0.0 & npm run dev -- --hostname 0.0.0.0"

volumes:
  classrack-11249-pgdata:
