services:
  classrack-db:
    image: postgres:16
    container_name: classrack-db
    environment:
      POSTGRES_USER: classrack
      POSTGRES_PASSWORD: classrack
      POSTGRES_DB: classrack
    ports:
      - "5433:5432"
    volumes:
      - classrack-pgdata:/var/lib/postgresql/data

  classrack-web:
    build: .
    container_name: classrack-web
    ports:
      - "3001:3000"
      - "5556:5555"
    environment:
      DATABASE_URL: postgresql://classrack:classrack@classrack-db:5432/classrack
      AUTH_URL: http://localhost:3001
      NEXTAUTH_URL: http://localhost:3001
      NEXT_PUBLIC_SITE_URL: http://localhost:3001
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - classrack-db
    command: sh -c "npx prisma studio --port 5555 --hostname 0.0.0.0 & npm run dev -- --hostname 0.0.0.0"

volumes:
  classrack-pgdata:
